spring.application.name=evaluation-query-api
server.port=${EVALUATION_QUERY_API_PORT:8082}

# JWT RS256 emitido por auth-api (HU10). Solo la clave pública X.509, en un archivo externo
# (p. ej. file:/ruta/jwt-publica.pem); nunca se versiona. El emisor debe coincidir con el de auth-api.
# Ambas variables son obligatorias: sin ellas la aplicación no arranca.
evaluationquery.jwt.emisor=${AUTH_JWT_ISSUER}
evaluationquery.jwt.audiencia=evaluation-query-api
evaluationquery.jwt.clave-publica=${EVALUATION_QUERY_JWT_PUBLIC_KEY_LOCATION}

# Misma base PostgreSQL que scoring-api. Sobre sus tablas (esquema public; HU13, HU14, HU15) esta API solo
# ejecuta SELECT: el rol de la aplicación debe tener únicamente permisos de lectura sobre ellas. En su esquema
# propio (EVALUATION_QUERY_DB_SCHEMA, por defecto "consulta") guarda recomendaciones y snapshots; requiere
# SELECT/INSERT y UPDATE limitado a estado en proyeccion_evaluacion. EVALUATION_QUERY_DB_URL tiene el formato
# postgresql://host:puerto/base (Spring agrega el prefijo jdbc:).
spring.datasource.url=jdbc:${EVALUATION_QUERY_DB_URL:}
spring.datasource.username=${EVALUATION_QUERY_DB_USERNAME:}
spring.datasource.password=${EVALUATION_QUERY_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HU14: Flyway de esta API solo gestiona su esquema propio (lo crea el administrador; Flyway no lo crea) y
# nunca migra public, que pertenece a scoring-api. Para migrar con un rol distinto del de la aplicación se
# definen SPRING_FLYWAY_USER y SPRING_FLYWAY_PASSWORD; si no, usa las credenciales del datasource.
evaluationquery.consulta.esquema=${EVALUATION_QUERY_DB_SCHEMA:consulta}
spring.flyway.schemas=${evaluationquery.consulta.esquema}
spring.flyway.default-schema=${evaluationquery.consulta.esquema}
spring.flyway.create-schemas=false
# Un arranque normal solo valida (con migraciones pendientes no arranca y no aplica ninguna). Migrar exige
# EVALUATION_QUERY_FLYWAY_MIGRAR_AL_ARRANCAR=true en un despliegue controlado (docs/operacion/despliegue.md).
evaluationquery.flyway.migrar-al-arrancar=${EVALUATION_QUERY_FLYWAY_MIGRAR_AL_ARRANCAR:false}

# HU14: catálogo versionado de recomendaciones. Solo un catálogo con estado APROBADO genera recomendaciones;
# el incluido es la versión 1, aprobada el 2026-10-19 (P-HU14-01).
evaluationquery.catalogo.ubicacion=${EVALUATION_QUERY_CATALOGO_LOCATION:classpath:catalogo/recomendaciones.json}

# HU14: operación interna de generación para la saga de scoring-api, deshabilitada por defecto. Con la saga
# habilitada, los tokens de servicio S1 se validan con la clave pública de scoring-api (PEM X.509 externo) y su
# kid; la clave anterior es opcional y solo se usa durante una rotación. Deben coincidir con scoring.servicio-jwt.
evaluationquery.saga.habilitada=${EVALUATION_QUERY_SAGA_HABILITADA:false}
evaluationquery.servicio-jwt.emisor=${SCORING_SERVICE_JWT_ISSUER:scoring-api}
evaluationquery.servicio-jwt.sujeto=scoring-api
evaluationquery.servicio-jwt.audiencia=evaluation-query-api-internal
evaluationquery.servicio-jwt.permiso=recomendaciones:generar
evaluationquery.servicio-jwt.permiso-proyeccion=proyeccion:actualizar
evaluationquery.servicio-jwt.tipo=scoring-svc+jwt
evaluationquery.servicio-jwt.tolerancia=30s
evaluationquery.servicio-jwt.duracion-maxima=60s
evaluationquery.servicio-jwt.id-clave=${SCORING_SERVICE_JWT_KEY_ID:}
evaluationquery.servicio-jwt.clave-publica=${SCORING_SERVICE_JWT_PUBLIC_KEY_LOCATION:}
evaluationquery.servicio-jwt.id-clave-anterior=${SCORING_SERVICE_JWT_PREVIOUS_KEY_ID:}
evaluationquery.servicio-jwt.clave-publica-anterior=${SCORING_SERVICE_JWT_PREVIOUS_PUBLIC_KEY_LOCATION:}

# Orígenes del frontend, separados por coma.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger deshabilitado por defecto; se habilita con el perfil "dev" (application-dev.properties).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
