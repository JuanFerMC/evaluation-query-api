name: Tests unitarios y cobertura SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: Pruebas unitarias y JaCoCo
    runs-on: ubuntu-latest

    steps:
      # Descargar el código
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configurar Java
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Preparar Maven Wrapper
      - name: Preparar Maven Wrapper
        run: chmod +x mvnw

      # Ejecutar únicamente las pruebas unitarias
      - name: Ejecutar pruebas unitarias y JaCoCo
        run: ./mvnw -B clean test

      # Comprobar el reporte XML
      - name: Comprobar informe JaCoCo
        run: |
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "ERROR: No se encontró el reporte XML de JaCoCo."
            echo "Archivos disponibles en target/site:"
            find target/site -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Reporte JaCoCo encontrado correctamente."

      # Enviar análisis y cobertura a SonarCloud
      - name: Analizar en SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_TOKEN" || (echo "ERROR: Falta SONAR_TOKEN" && exit 1)
          test -n "$SONAR_ORGANIZATION" || (echo "ERROR: Falta SONAR_ORGANIZATION" && exit 1)
          test -n "$SONAR_PROJECT_KEY" || (echo "ERROR: Falta SONAR_PROJECT_KEY" && exit 1)

          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
